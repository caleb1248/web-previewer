# Publishes the extension to the VS Code Marketplace when a version tag is pushed:
#   git tag v0.0.2 && git push origin v0.0.2
# The tag must match "version" in package.json.
#
# Authenticates with Marketplace trusted publishing (OIDC), so there's no token
# secret. The trusted publisher configured on the Marketplace must point at this
# repository and this workflow file (publish.yml).

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vsce runs the prepublish script through npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version} (expected v${version})"
            exit 1
          fi

      # Every platform's rolldown binding, so each platform package can include its own.
      - name: Install dependencies
        run: bun install --frozen-lockfile --os='*' --cpu='*'

      # One .vsix per platform target, plus web and universal, in vsix/.
      - name: Package
        run: bun run package:vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vsix/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to Marketplace
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # Marketplace trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Each .vsix records its own target, so one command publishes them all.
      # --skip-duplicate makes a re-run after a partial failure safe.
      - name: Publish
        run: bunx @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath vsix/*.vsix

      - name: Attach packages to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" vsix/*.vsix --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
